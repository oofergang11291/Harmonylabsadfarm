name: Daily HarmonyLabs Ads

on:
  schedule:
    # Every day at 9:13 AM New Zealand time; DST handled by timezone.
    # Set Buffer's daily posting slot to 6 PM Pacific/Auckland.
    - cron: '13 9 * * *'
      timezone: 'Pacific/Auckland'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harmonylabs-daily-post
  cancel-in-progress: false

jobs:
  daily-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out ad assets and posting state
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Queue one ad per HarmonyLabs social channel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: python auto_post.py

      - name: Save successful post history (also after partial errors)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posting_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record automated HarmonyLabs posts [skip ci]"
            git push
          else
            echo "No new posting history to commit"
          fi
